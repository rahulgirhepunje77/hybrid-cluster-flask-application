
grafana:
  enabled: true
  adminUser: admin
  adminPassword: "CHANGE_TO_A_STRONG_PASSWORD"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

prometheus:
  enabled: true
  prometheusSpec:
    retention: 1d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 768Mi

prometheusOperator:
  # Workaround for the GHCR image-pull failure in your Kind lab.
  # This disables admission webhook certificate-generation jobs.
  admissionWebhooks:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true

alertmanager:
  enabled: false
