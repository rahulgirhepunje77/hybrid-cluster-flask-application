
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: hybrid-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: payment-api:v1
          imagePullPolicy: IfNotPresent
          imagePullSecrets:
          - name: docker-registry-secret
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: DB_HOST
              value: postgres.hybrid-lab.svc.cluster.local
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: hybrid-lab
spec:
  type: ClusterIP
  selector:
    app: payment-api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
